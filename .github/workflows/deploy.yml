name: Deploy Felsstudio

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run data:validate
      - run: npm run build

  deploy:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Deploy to production
        run: |
          cd /home/vorstieg/felsstudio
          git pull origin main
          npm ci
          npm run build
          PM2_HOME=/home/vorstieg/.pm2 pm2 restart felsstudio
