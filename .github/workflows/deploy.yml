name: Deploy Felsstudio

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to production
        run: |
          cd /home/vorstieg/felsstudio
          git pull origin main
          rm -rf node_modules package-lock.json
          npm install
          npm run build
          PM2_HOME=/home/vorstieg/.pm2 pm2 restart felsstudio
